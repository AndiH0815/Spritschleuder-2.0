name: Firmware and control checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sprit-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: ESP32-C3 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-ci -DIDF_TARGET=esp32c3 build
          python -c 'import pathlib; print("RESOLVED_DEPENDENCIES_BEGIN"); print(pathlib.Path("dependencies.lock").read_text()); print("RESOLVED_DEPENDENCIES_END")'
      - name: Host control, storage and access checks
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends g++ libssl-dev
          CJSON_SOURCE="$PWD/managed_components/espressif__cjson/cJSON" sh tools/test.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Tablet menus and dispensing flow
        run: node tests/test_web.cjs
